replicaCount: 1

image:
  django: "835665967244.dkr.ecr.us-west-2.amazonaws.com/lesson-7-django-repo"
  nginx: "nginx:alpine"
  tag: v1.0.3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

config:
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "postgres"
  DJANGO_ALLOWED_HOSTS: "*"
  DEBUG: "False"

# SECRET_KEY і POSTGRES_PASSWORD навмисно НЕ тут — вони в Kubernetes Secret
# "django-app-secrets", який створює Terraform (modules/argo-cd/app_secrets.tf)
# з TF_VAR_django_secret_key / TF_VAR_django_postgres_password, а не Helm/git.
# deployment.yaml підключає їх окремим envFrom.secretRef.
